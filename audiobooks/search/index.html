<script>
  // 加载更多逻辑
(function () {
  const ITEMS_PER_LOAD = 50; // ⭐默认 50，就改这里

  function initLoadMore() {
    const list = document.querySelector(".ebook-list");
    const btn = document.getElementById("loadMoreBtn");

    if (!list || !btn) return;

    const items = Array.from(list.children);
    let visibleCount = ITEMS_PER_LOAD;

    function updateView() {
      items.forEach((item, index) => {
        item.style.display = index < visibleCount ? "block" : "none";
      });

      if (visibleCount >= items.length) {
        btn.textContent = "我也是有底线的！";
        btn.classList.add("disabled");
        btn.disabled = true;
      }
    }

    // 初始
    updateView();

    btn.addEventListener("click", function () {
      if (btn.classList.contains("disabled")) return;
      visibleCount += ITEMS_PER_LOAD;
      updateView();
    });
  }

  // DOM ready
  document.addEventListener("DOMContentLoaded", initLoadMore);

  // window load（解决 Masonry / CubePortfolio 复算）
  window.addEventListener("load", initLoadMore);
})();



  // ===== ？？ =====
$(document).on('ready', function () {
  $.HSCore.components.HSTabs.init('[role="tablist"]');
  $.HSCore.components.HSPopup.init('.js-fancybox');
  $.HSCore.components.HSGoTo.init('.js-go-to');
  setTimeout(function () {
    $.HSCore.components.HSStickyBlock.init('.js-sticky-block');
  }, 300);

  // ===== 字幕滚动功能 =====
  $('.show-subtitles').on('click', function() {
    const subtitleUrl = $(this).data('subtitle'); // JSON 字幕路径
    const audioElem = $(this).closest('.audio-card').find('audio')[0];
    const subtitleBox = $(this).siblings('.subtitle-box');

    if (!subtitleUrl || !audioElem) return;

    subtitleBox.html('');      // 清空之前字幕
    subtitleBox.show();        // 显示字幕框

    fetch(subtitleUrl)
      .then(res => res.json())
      .then(subtitles => {
        // subtitles 格式：[{start:0.5,end:3.2,text:"字幕内容"},...]
        function updateSubtitle() {
          const currentTime = audioElem.currentTime;
          const currentLine = subtitles.find(line => currentTime >= line.start && currentTime <= line.end);
          if (currentLine) {
            subtitleBox.html(currentLine.text);
          } else {
            subtitleBox.html('');
          }
          if (!audioElem.paused && !audioElem.ended) {
            requestAnimationFrame(updateSubtitle);
          }
        }

        // 播放/继续时同步滚动
        audioElem.addEventListener('play', () => updateSubtitle());
        // 自动开始显示
        updateSubtitle();
      })
      .catch(err => console.error('字幕加载失败', err));
  });
});

$(window).on('load', function () {
  $.HSCore.components.HSHeader.init($('#js-header'));
  $.HSCore.helpers.HSHamburgers.init('.hamburger');
  $('.js-mega-menu').HSMegaMenu({

      percentPosition: true

});
